<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بدمینتون چرخشی</title>
<meta name="theme-color" content="#1e7048">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بدمینتون">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;-webkit-tap-highlight-color:transparent}

/* Layout: one narrow courtside column — header, then a screen per phase (setup → rounds → final). Each round shows one green court card per court. */
:root{
  --bg:#eef4f0; --surface:#ffffff; --surface-2:#e2ece5; --line:#c6d8cc;
  --ink:#122219; --muted:#55695c;
  --court:#1e7048; --court-ink:#ffffff;
  --shuttle:#f2b632; --shuttle-ink:#2a1d00;
  --good:#1f8a5b; --bad:#c2412d;
  --display:"Lalezar","Vazirmatn",system-ui,sans-serif;
  --body:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1510; --surface:#13221a; --surface-2:#1a2e23; --line:#2a4436;
  --ink:#e6f1ea; --muted:#9bb5a5;
  --court:#2f9a64; --court-ink:#ffffff;
  --shuttle:#f5c650; --shuttle-ink:#2a1d00;
  --good:#4cc38a; --bad:#ef7a64; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1510; --surface:#13221a; --surface-2:#1a2e23; --line:#2a4436;
  --ink:#e6f1ea; --muted:#9bb5a5;
  --court:#2f9a64; --court-ink:#ffffff;
  --shuttle:#f5c650; --shuttle-ink:#2a1d00;
  --good:#4cc38a; --bad:#ef7a64; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1.1;margin:0;color:var(--court);text-wrap:balance}
h1 span{color:var(--shuttle)}
h2{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0;line-height:1.3}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.num{font-variant-numeric:tabular-nums}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--shuttle);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--surface-2);color:var(--ink);transition:transform .08s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-main{background:var(--court);color:var(--court-ink);font-size:1.05rem;padding:14px 18px}
.btn-sh{background:var(--shuttle);color:var(--shuttle-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.btn-danger{background:var(--bad);color:#fff}
.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:5px 8px 5px 14px;font-weight:500}
.chip.off{opacity:.45;text-decoration:line-through}
.chip.new{outline:2px solid var(--shuttle)}
.chip button{padding:2px 9px;border-radius:999px;background:transparent;color:var(--muted);font-weight:800;line-height:1.4}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:52px;background:var(--bg);border:1px solid var(--line);font-weight:500}
.seg button[aria-pressed=true]{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);padding:8px 12px;border-radius:10px;margin:0}
.ok{font-size:.88rem;color:var(--good);font-weight:700;margin:0}
.err{color:var(--bad);font-weight:700;font-size:.9rem;margin:0}
.err:empty,.ok:empty{display:none}

/* courts */
.courts{display:flex;flex-direction:column;gap:14px}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.court{position:relative;border-radius:var(--r);overflow:hidden;background:var(--court);color:var(--court-ink);display:grid;grid-template-columns:1fr 1fr}
.court::before{content:"";position:absolute;inset:10px;border:2px solid color-mix(in srgb,var(--court-ink) 70%,transparent);pointer-events:none}
.court::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:var(--court-ink);opacity:.9}
.side{padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;min-width:0}
.side .tag{font-size:.75rem;letter-spacing:.04em;opacity:.85;font-weight:700}
.side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;text-align:center}
.side li{font-family:var(--display);font-size:1.4rem;line-height:1.25;overflow-wrap:anywhere}
.side.b li{color:var(--shuttle)}
.score{margin-top:auto}
.score input{width:4.2ch;min-width:0;font-family:var(--display);font-size:2.3rem;line-height:1.1;text-align:center;padding:6px 4px;border-radius:12px;border:2px solid color-mix(in srgb,var(--court-ink) 55%,transparent);background:color-mix(in srgb,#000 14%,transparent);color:var(--court-ink)}
.score input::placeholder{color:var(--court-ink);opacity:.45}
.side.b .score input{border-color:var(--shuttle);color:var(--shuttle)}
.roundno{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.roundno b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--court)}
.bench{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--muted)}
.bench .chip{padding:3px 12px;font-size:.88rem}
.late{border:2px dashed var(--shuttle)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border-radius:0;padding:7px 12px;background:transparent;color:var(--muted);font-weight:700}
.lang button[aria-pressed=true]{background:var(--court);color:var(--court-ink)}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;color:var(--muted);font-weight:700}
td.name,th.name{text-align:start;font-weight:700}
td.rk{font-family:var(--display);font-size:1.15rem;width:2.2em}
tr.r1 td.rk{color:var(--shuttle)} tr.r2 td.rk{color:var(--muted)} tr.r3 td.rk{color:var(--court)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.hist>li{display:flex;flex-direction:column;gap:4px}
.hist .rn{color:var(--muted);font-size:.8rem;font-weight:700}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2);font-size:.9rem}
.m .t{min-width:0;overflow-wrap:anywhere}
.m .t:last-child{text-align:end}
.m .w{font-weight:800}
.m .sc{font-family:var(--display);font-size:1.1rem}
.matrix td{min-width:34px}
.matrix td.z{color:var(--muted);opacity:.5}
.heat{display:inline-block;min-width:26px;padding:2px 4px;border-radius:6px;font-weight:700}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;text-align:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .nm{font-family:var(--display);font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere}
.pod .blk{width:100%;border-radius:10px 10px 4px 4px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:var(--display);font-size:1.8rem}
.p1 .blk{height:110px;background:var(--shuttle);color:var(--shuttle-ink)}
.p2 .blk{height:80px;background:var(--surface-2);color:var(--ink)}
.p3 .blk{height:60px;background:var(--court);color:var(--court-ink)}
.pod .st{font-size:.8rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:700}
@media (prefers-reduced-motion:reduce){button{transition:none}}
@media (max-width:420px){.side li{font-size:1.15rem}.score input{font-size:1.9rem}}
</style>
</head>
<body>

<div class="wrap" id="wrap" dir="rtl" lang="fa">
  <header>
    <h1 id="title"></h1>
    <div class="hbtns">
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="fa">فارسی</button><button type="button" data-lang="en">English</button></div>
      <button class="btn-ghost" id="resetBtn" type="button" style="white-space:nowrap"></button>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
(function(){
const KEY='bd-rotate-v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const toLatin=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));

const SAMPLE={fa:['آرش','سینا','مهدی','نیما','رضا','پویا'],en:['Arash','Sina','Mehdi','Nima','Reza','Pouya']};
function fresh(lang){lang=lang||'fa';return{lang,phase:'setup',sample:true,players:SAMPLE[lang].map(n=>({id:uid(),name:n,active:true,base:0})),mode:2,courts:1,rounds:[],current:null}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.players||!S.rounds)S=fresh();
if(!S.lang)S.lang='fa';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let ui={err:'',ok:'',confirm:null,newIds:[]};

/* ---------- language ---------- */
const FA=()=>S.lang==='fa';
const fa=n=>FA()?Number(n).toLocaleString('fa-IR'):String(n);
const faSigned=n=>(n>0?'+':n<0?'−':'')+fa(Math.abs(n));
const L={
 fa:{
  title:'بدمینتون <span>چرخشی</span>',doc:'بدمینتون چرخشی',reset:'↺ شروع دوباره',
  resetTitle:'شروع دوباره',resetDesc:'«بازی جدید» نتیجه‌ها را پاک می‌کند ولی اسم‌ها می‌مانند. «پاک کردن همه چیز» اسم‌ها را هم پاک می‌کند.',
  rsKeep:'بازی جدید با همین بازیکن‌ها',rsAll:'پاک کردن همه چیز',cancel:'انصراف',
  players:'بازیکن‌ها',sample:'این اسم‌ها نمونه هستند. اولین اسم را که اضافه کنی پاک می‌شوند.',namePh:'اسم بازیکن…',add:'اضافه کن',
  dup:'این اسم قبلاً اضافه شده.',nobody:'هنوز کسی اضافه نشده.',people:n=>`${fa(n)} نفر`,clearAll:'پاک کردن همه',
  gameType:'نوع بازی',singles:'یک‌نفره (سینگل)',doubles:'دونفره (دبل)',courtsQ:'چند زمین دارید؟',courtN:n=>`${fa(n)} زمین`,
  minTwo:'حداقل دو نفر اضافه کن.',sLbl:'یک‌نفره',dLbl:'دونفره',vs:(x,y)=>`${fa(x)} در برابر ${fa(y)}`,
  perRound:(n,p)=>`هر دور ${fa(n)} بازی: ${p}.`,resting:n=>` ${fa(n)} نفر استراحت می‌کنند و دور بعد اول بازی می‌کنند.`,
  start:'شروع و قرعه‌ی دور اول',needTwo:'حداقل دو بازیکن حاضر لازم است.',
  round:n=>`دور ${fa(n)}`,done:n=>`${fa(n)} دور تمام‌شده`,court:n=>`زمین ${fa(n)}`,teamA:'تیم سبز',teamB:'تیم زرد',score:'امتیاز',
  bench:'استراحت:',tie:'امتیاز دو تیم مساوی است. امتیاز برنده را وارد کن.',finish:'ثبت نتیجه و دور بعد',redraw:'قرعه‌ی دوباره',
  late:'بازیکن دیررسیده',latePh:'اسم بازیکن تازه…',lateOk:n=>`${n} اضافه شد و دور بعد بازی می‌کند.`,
  lateNote:'از دور بعد وارد بازی می‌شود و چون دیر آمده، اول بازی می‌کند. امتیازش از همین حالا حساب می‌شود.',
  leftQ:'کسی رفت؟ (غایب / برگشت)',left:'رفت',back:'برگشت',
  rankSoFar:'رنکینگ تا اینجا',past:'دورهای گذشته',pairsQ:'یارها: چند بار با هم هم‌تیمی بوده‌اند',
  end:'پایان بازی و رنکینگ نهایی',endYes:'بله، تمام کن',endNo:'ادامه بده',
  final:'رنکینگ نهایی',finalSub:(r,m)=>`${fa(r)} دور، ${fa(m)} بازی`,all:'همه‌ی بازی‌ها',pairs:'یارها',toGame:'برگشت به بازی',newGame:'بازی جدید',
  wonOf:(w,p)=>`${fa(w)} برد از ${fa(p)}`,noGames:'هنوز بازی‌ای ثبت نشده.',
  th:['#','بازیکن','بازی','برد','باخت','درصد برد','تفاضل امتیاز'],pct:'٪',
  rankNote:'ترتیب: درصد برد، بعد تعداد برد، بعد تفاضل امتیاز.',matrixNote:'عددهای کم و نزدیک به هم یعنی چرخش منصفانه بوده.',sep:'، '
 },
 en:{
  title:'Badminton <span>Rotation</span>',doc:'Badminton Rotation',reset:'↺ Restart',
  resetTitle:'Restart',resetDesc:'“New game” clears the results but keeps the names. “Clear everything” removes the names too.',
  rsKeep:'New game, same players',rsAll:'Clear everything',cancel:'Cancel',
  players:'Players',sample:'These names are examples. They disappear when you add the first name.',namePh:'Player name…',add:'Add',
  dup:'That name is already added.',nobody:'No one added yet.',people:n=>`${n} ${n===1?'player':'players'}`,clearAll:'Clear all',
  gameType:'Game type',singles:'Singles',doubles:'Doubles',courtsQ:'How many courts?',courtN:n=>`${n} ${n===1?'court':'courts'}`,
  minTwo:'Add at least two players.',sLbl:'singles',dLbl:'doubles',vs:(x,y)=>`${x} vs ${y}`,
  perRound:(n,p)=>`Each round: ${n} ${n===1?'game':'games'} (${p}).`,resting:n=>` ${n} sit out and play first next round.`,
  start:'Start and draw round 1',needTwo:'At least two players must be present.',
  round:n=>`Round ${n}`,done:n=>`${n} ${n===1?'round':'rounds'} finished`,court:n=>`Court ${n}`,teamA:'Green',teamB:'Yellow',score:'Score',
  bench:'Sitting out:',tie:'The scores are tied. Enter the winning score.',finish:'Save scores & next round',redraw:'Redraw',
  late:'Late arrival',latePh:'New player’s name…',lateOk:n=>`${n} added and plays next round.`,
  lateNote:'They join from the next round and get priority because they arrived late. Their ranking starts from now.',
  leftQ:'Someone left? (away / back)',left:'Left',back:'Back',
  rankSoFar:'Ranking so far',past:'Past rounds',pairsQ:'Partners: how often each pair has teamed up',
  end:'End game & final ranking',endYes:'Yes, end it',endNo:'Keep playing',
  final:'Final ranking',finalSub:(r,m)=>`${r} ${r===1?"round":"rounds"}, ${m} ${m===1?"game":"games"}`,all:'All games',pairs:'Partners',toGame:'Back to game',newGame:'New game',
  wonOf:(w,p)=>`${w} won of ${p}`,noGames:'No games recorded yet.',
  th:['#','Player','Played','Won','Lost','Win %','Point diff'],pct:'%',
  rankNote:'Order: win %, then wins, then point difference.',matrixNote:'Low, even numbers mean the rotation was fair.',sep:', '
 }
};
const t=(k,...a)=>{const v=L[S.lang][k];return typeof v==='function'?v(...a):v};

const P=id=>S.players.find(p=>p.id===id);
const nm=id=>(P(id)||{name:'?'}).name;
const active=()=>S.players.filter(p=>p.active);
const allMatches=()=>S.rounds.flatMap(r=>r.matches);

/* ---------- stats ---------- */
function stats(){
  const st={};S.players.forEach(p=>st[p.id]={id:p.id,played:0,w:0,l:0,pf:0,pa:0,short:0});
  const pair={},opp={};
  const k=(a,b)=>a<b?a+'|'+b:b+'|'+a;
  allMatches().forEach(s=>{
    [[s.a,s.sa,s.sb],[s.b,s.sb,s.sa]].forEach(([tm,f,ag])=>tm.forEach(id=>{const x=st[id];if(!x)return;x.played++;x.pf+=f;x.pa+=ag;f>ag?x.w++:x.l++;}));
    if(s.a.length!==s.b.length)(s.a.length<s.b.length?s.a:s.b).forEach(id=>st[id]&&st[id].short++);
    [s.a,s.b].forEach(tm=>{for(let i=0;i<tm.length;i++)for(let j=i+1;j<tm.length;j++){const q=k(tm[i],tm[j]);pair[q]=(pair[q]||0)+1}});
    s.a.forEach(x=>s.b.forEach(y=>{const q=k(x,y);opp[q]=(opp[q]||0)+1}));
  });
  return{st,pair,opp,key:k};
}

/* ---------- plan: how many matches and what sizes ---------- */
function plan(n){
  const k=S.mode,per=2*k,out=[];let left=n;
  for(let c=0;c<S.courts&&left>=2;c++){
    if(left>=per){out.push([k,k]);left-=per}
    else{out.push([Math.ceil(left/2),Math.floor(left/2)]);left=0}
  }
  return out;
}

/* ---------- fair draw ---------- */
function combos(arr,r){const out=[];const go=(s,acc)=>{if(acc.length===r){out.push(acc.slice());return}for(let i=s;i<arr.length;i++){acc.push(arr[i]);go(i+1,acc);acc.pop()}};go(0,[]);return out}
function draw(){
  const act=active();const n=act.length;
  if(n<2){ui.err=t('needTwo');return false}
  const {st,pair,opp,key}=stats();
  const sizes=plan(n),slots=sizes.reduce((s,[x,y])=>s+x+y,0);
  const lastR=S.rounds[S.rounds.length-1];
  const sat=new Set(lastR?lastR.bench||[]:[]);
  // who plays: fewest games first; whoever sat out last round goes first; then random
  const order=shuffle(act).sort((x,y)=>{
    const ex=st[x.id].played+x.base,ey=st[y.id].played+y.base;
    if(ex!==ey)return ex-ey;
    return (sat.has(y.id)?1:0)-(sat.has(x.id)?1:0);
  });
  const playing=order.slice(0,slots).map(p=>p.id);
  const lastSigs=new Set((lastR?lastR.matches:[]).map(m=>[m.a.slice().sort().join(','),m.b.slice().sort().join(',')].sort().join('/')));
  const teamCost=tm=>{let c=0;for(let i=0;i<tm.length;i++)for(let j=i+1;j<tm.length;j++){const p=pair[key(tm[i],tm[j])]||0;c+=10*p*p+3*p}return c};
  function bestSplit(g,x){
    let cands=combos(g,x);if(x*2===g.length)cands=cands.filter(c=>c.includes(g[0]));
    let best=null;
    cands.forEach(A=>{
      const B=g.filter(v=>!A.includes(v));
      let c=teamCost(A)+teamCost(B);
      A.forEach(a=>B.forEach(b=>{const o=opp[key(a,b)]||0;c+=2*o*o}));
      if(A.length!==B.length)(A.length<B.length?A:B).forEach(id=>c+=8*st[id].short);
      const sig=[A.slice().sort().join(','),B.slice().sort().join(',')].sort().join('/');
      if(lastSigs.has(sig))c+=100;
      if(!best||c<best.c)best={A,B,c};
    });
    return best;
  }
  let best=null;
  const tries=sizes.length>1?300:1;
  for(let i=0;i<tries;i++){
    const pl=shuffle(playing);let idx=0,total=0;const ms=[];
    for(const [x,y] of sizes){const g=pl.slice(idx,idx+x+y);idx+=x+y;const b=bestSplit(g,x);total+=b.c;ms.push(b)}
    if(!best||total<best.total)best={total,ms};
  }
  S.current={matches:best.ms.map(m=>Math.random()<.5?{a:m.A,b:m.B,sa:0,sb:0}:{a:m.B,b:m.A,sa:0,sb:0}),
             bench:act.map(p=>p.id).filter(id=>!playing.includes(id))};
  ui.err='';return true;
}

/* ---------- views ---------- */
const app=document.getElementById('app'),wrap=document.getElementById('wrap');
function chrome(){
  const dir=FA()?'rtl':'ltr';
  wrap.dir=dir;wrap.lang=S.lang;document.documentElement.dir=dir;document.documentElement.lang=S.lang;
  document.title=t('doc');
  document.getElementById('title').innerHTML=t('title');
  document.getElementById('resetBtn').textContent=t('reset');
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
}
function render(){save();chrome();app.innerHTML=(ui.confirm==='reset'?vReset():'')+(S.phase==='setup'?vSetup():S.phase==='game'?vGame():vFinal());bind();}

function vReset(){
  return `<section class="card" style="border:2px solid var(--bad)">
    <h2>${t('resetTitle')}</h2>
    <p class="sub">${t('resetDesc')}</p>
    <div class="row">
      <button class="btn-main" id="rsKeep" style="flex:1">${t('rsKeep')}</button>
      <button class="btn-danger" id="rsAll" style="flex:1">${t('rsAll')}</button>
    </div>
    <button class="btn-ghost wide" id="rsNo">${t('cancel')}</button>
  </section>`;
}

function planText(n){
  if(n<2)return t('minTwo');
  const sz=plan(n);const used=sz.reduce((s,[x,y])=>s+x+y,0);
  const parts=sz.map(([x,y])=>x===y?(x===1?t('sLbl'):t('dLbl')):t('vs',x,y));
  let s=t('perRound',sz.length,parts.join(t('sep')));
  if(n>used)s+=t('resting',n-used);
  return s;
}

function vSetup(){
  const act=active().length;
  return `
  <section class="card">
    <h2>${t('players')}</h2>
    ${S.sample?`<p class="note">${t('sample')}</p>`:''}
    <form id="addf" class="row">
      <input type="text" id="pname" placeholder="${t('namePh')}" autocomplete="off" aria-label="${t('namePh')}">
      <button class="btn-sh" type="submit">${t('add')}</button>
    </form>
    <p class="err">${esc(ui.err)}</p>
    <div class="chips">${S.players.map(p=>`<span class="chip">${esc(p.name)}<button data-del="${p.id}" aria-label="× ${esc(p.name)}">×</button></span>`).join('')||`<span class="sub">${t('nobody')}</span>`}</div>
    <div class="row" style="justify-content:space-between">
      <span class="sub num">${t('people',S.players.length)}</span>
      ${S.players.length?`<button class="btn-ghost" id="clear">${t('clearAll')}</button>`:''}
    </div>
  </section>
  <section class="card">
    <h2>${t('gameType')}</h2>
    <div class="seg"><button data-mode="1" aria-pressed="${S.mode===1}">${t('singles')}</button><button data-mode="2" aria-pressed="${S.mode===2}">${t('doubles')}</button></div>
    <h2>${t('courtsQ')}</h2>
    <div class="seg">${[1,2,3,4].map(n=>`<button data-courts="${n}" aria-pressed="${n===S.courts}">${t('courtN',n)}</button>`).join('')}</div>
    <p class="sub">${planText(act)}</p>
  </section>
  <button class="btn-main wide" id="start" ${act<2?'disabled':''}>${t('start')}</button>`;
}

function vGame(){
  const c=S.current,n=S.rounds.length+1,multi=c.matches.length>1;
  const side=(cls,tag,ids,sc,mi,key)=>`<div class="side ${cls}"><span class="tag">${tag}</span><ul>${ids.map(id=>`<li>${esc(nm(id))}</li>`).join('')}</ul>
    <div class="score"><input type="text" inputmode="numeric" class="num" id="in-${mi}-${key}" data-mi="${mi}" data-sc="${key}" value="${sc?fa(sc):''}" placeholder="${fa(0)}" aria-label="${t('score')} ${tag}${multi?' '+t('court',mi+1):''}" autocomplete="off"></div></div>`;
  return `
  <div class="roundno"><b>${t('round',n)}</b><span class="sub">${t('done',S.rounds.length)}</span></div>
  <div class="courts">${c.matches.map((m,i)=>`<div>
    ${multi?`<div class="ctitle"><span>${t('court',i+1)}</span></div>`:''}
    <div class="court">${side('a',t('teamA'),m.a,m.sa,i,'sa')}${side('b',t('teamB'),m.b,m.sb,i,'sb')}</div></div>`).join('')}</div>
  ${c.bench.length?`<div class="bench">${t('bench')} ${c.bench.map(id=>`<span class="chip">${esc(nm(id))}</span>`).join('')}</div>`:''}
  <p class="err">${esc(ui.err)}</p>
  <div class="row">
    <button class="btn-main" id="finish" style="flex:2">${t('finish')}</button>
    <button class="btn-ghost" id="redraw" style="flex:1">${t('redraw')}</button>
  </div>
  <section class="card late">
    <h2>${t('late')}</h2>
    <form id="addg" class="row"><input type="text" id="gname" placeholder="${t('latePh')}" autocomplete="off" aria-label="${t('latePh')}"><button class="btn-sh" type="submit">${t('add')}</button></form>
    <p class="ok">${esc(ui.ok)}</p>
    <p class="sub">${t('lateNote')}</p>
    <details><summary>${t('leftQ')}</summary>
      <div class="chips" style="margin-top:10px">${S.players.map(p=>`<span class="chip ${p.active?'':'off'} ${ui.newIds.includes(p.id)?'new':''}">${esc(p.name)}<button data-tog="${p.id}">${p.active?t('left'):t('back')}</button></span>`).join('')}</div>
    </details>
  </section>
  ${S.rounds.length?`<section class="card"><h2>${t('rankSoFar')}</h2>${tblRank()}</section>`:''}
  ${S.rounds.length?`<section class="card"><h2>${t('past')}</h2>${histList()}</section>`:''}
  <section class="card"><details><summary>${t('pairsQ')}</summary><div style="margin-top:12px">${matrix()}</div></details></section>
  <div class="row">
    ${ui.confirm==='end'?`<button class="btn-danger" id="endyes" style="flex:1">${t('endYes')}</button><button class="btn-ghost" id="nope" style="flex:1">${t('endNo')}</button>`:
      `<button class="btn-sh wide" id="end" ${S.rounds.length?'':'disabled'}>${t('end')}</button>`}
  </div>`;
}

function vFinal(){
  const r=ranking();
  const pod=(p,i)=>p?`<div class="pod p${i+1}"><span class="nm">${esc(nm(p.id))}</span><span class="st num">${t('wonOf',p.w,p.played)}</span><div class="blk">${fa(i+1)}</div></div>`:'<div></div>';
  return `
  <section class="card">
    <h2>${t('final')}</h2>
    <p class="sub num">${t('finalSub',S.rounds.length,allMatches().length)}</p>
    <div class="podium">${pod(r[1],1)}${pod(r[0],0)}${pod(r[2],2)}</div>
    ${tblRank()}
  </section>
  <section class="card"><h2>${t('all')}</h2>${histList()}</section>
  <section class="card"><h2>${t('pairs')}</h2>${matrix()}</section>
  <div class="row">
    <button class="btn-ghost" id="back" style="flex:1">${t('toGame')}</button>
    <button class="btn-main" id="rsOpen" style="flex:1">${t('newGame')}</button>
  </div>`;
}

function ranking(){
  const {st}=stats();
  return Object.values(st).filter(x=>x.played>0).map(x=>({...x,pct:x.w/x.played,diff:x.pf-x.pa}))
   .sort((a,b)=>b.pct-a.pct||b.w-a.w||b.diff-a.diff||a.played-b.played);
}
function tblRank(){
  const r=ranking();if(!r.length)return `<p class="sub">${t('noGames')}</p>`;
  const h=t('th');let prev=null,rank=0;
  return `<div class="tbl-wrap"><table class="num"><thead><tr><th>${h[0]}</th><th class="name">${h[1]}</th><th>${h[2]}</th><th>${h[3]}</th><th>${h[4]}</th><th>${h[5]}</th><th>${h[6]}</th></tr></thead><tbody>${
    r.map((x,i)=>{const sig=x.pct+'|'+x.w+'|'+x.diff;if(sig!==prev){rank=i+1;prev=sig}
      return `<tr class="r${rank}"><td class="rk">${fa(rank)}</td><td class="name">${esc(nm(x.id))}</td><td>${fa(x.played)}</td><td>${fa(x.w)}</td><td>${fa(x.l)}</td><td>${fa(Math.round(x.pct*100))}${t('pct')}</td><td class="${x.diff>0?'pos':x.diff<0?'neg':''}">${faSigned(x.diff)}</td></tr>`}).join('')
  }</tbody></table></div>
  <p class="sub">${t('rankNote')}</p>`;
}
function histList(){
  return `<ol class="hist">${S.rounds.map((r,i)=>`<li><span class="rn">${t('round',i+1)}</span>${r.matches.map(s=>{const aw=s.sa>s.sb;
    return `<div class="m"><span class="t ${aw?'w':''}">${s.a.map(id=>esc(nm(id))).join(t('sep'))}</span><span class="sc num">${fa(s.sa)} – ${fa(s.sb)}</span><span class="t ${aw?'':'w'}">${s.b.map(id=>esc(nm(id))).join(t('sep'))}</span></div>`}).join('')}</li>`).reverse().join('')}</ol>`;
}
function matrix(){
  const {pair,key}=stats();const ps=S.players;
  if(ps.length<2)return '';
  const max=Math.max(1,...Object.values(pair));
  return `<div class="tbl-wrap"><table class="matrix num"><thead><tr><th></th>${ps.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>${
    ps.map(a=>`<tr><th class="name">${esc(a.name)}</th>${ps.map(b=>{if(a.id===b.id)return '<td class="z">—</td>';const v=pair[key(a.id,b.id)]||0;
      return v?`<td><span class="heat" style="background:color-mix(in srgb,var(--court) ${Math.round(15+60*v/max)}%,transparent);color:${v/max>.6?'var(--court-ink)':'var(--ink)'}">${fa(v)}</span></td>`:`<td class="z">${fa(0)}</td>`}).join('')}</tr>`).join('')
  }</tbody></table></div><p class="sub">${t('matrixNote')}</p>`;
}

/* ---------- events ---------- */
function addPlayer(name,midGame){
  name=name.trim();if(!name)return false;
  if(S.players.some(p=>p.name===name)){ui.err=t('dup');return false}
  let base=0;
  if(midGame){const {st}=stats();const o=active().map(p=>st[p.id].played+p.base);base=o.length?Math.min(...o):0}
  const p={id:uid(),name,active:true,base};S.players.push(p);ui.err='';
  if(midGame){ui.newIds.push(p.id);ui.ok=t('lateOk',name)}
  return true;
}
function bind(){
  const $=id=>document.getElementById(id);
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};
  const af=$('addf');if(af)af.onsubmit=e=>{e.preventDefault();if(S.sample){S.players=[];S.sample=false}addPlayer($('pname').value,false);render();$('pname').focus()};
  const ag=$('addg');if(ag)ag.onsubmit=e=>{e.preventDefault();if(!addPlayer($('gname').value,true))ui.ok='';render();$('gname').focus()};
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.players=S.players.filter(p=>p.id!==b.dataset.del);S.sample=false;render()});
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=+b.dataset.mode;render()});
  app.querySelectorAll('[data-courts]').forEach(b=>b.onclick=()=>{S.courts=+b.dataset.courts;render()});
  app.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const p=P(b.dataset.tog);p.active=!p.active;
    if(p.active){const {st}=stats();const o=active().filter(x=>x.id!==p.id).map(x=>st[x.id].played+x.base);const mine=st[p.id].played+p.base;if(o.length){const mn=Math.min(...o);if(mine<mn)p.base+=mn-mine}}
    render();const d=document.querySelector('.late details');if(d)d.open=true});
  const ins=[...app.querySelectorAll('input[data-sc]')];
  ins.forEach((inp,i)=>{
    inp.onfocus=()=>inp.select();
    inp.oninput=()=>{const v=toLatin(inp.value).replace(/\D/g,'');S.current.matches[+inp.dataset.mi][inp.dataset.sc]=v?Math.min(99,parseInt(v,10)):0;save()};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(ins[i+1])ins[i+1].focus();else $('finish').click()}};
  });
  on('clear',()=>{S.players=[];S.sample=false;render()});
  on('start',()=>{S.sample=false;S.rounds=[];if(draw())S.phase='game';render()});
  on('redraw',()=>{draw();render()});
  on('finish',()=>{const c=S.current;
    const bad=c.matches.findIndex(m=>m.sa===m.sb);
    if(bad>=0){ui.err=(c.matches.length>1?t('court',bad+1)+': ':'')+t('tie');render();return}
    S.rounds.push({matches:c.matches.map(m=>({...m})),bench:c.bench});ui.newIds=[];ui.ok='';draw();ui.confirm=null;render();window.scrollTo({top:0,behavior:'smooth'})});
  on('end',()=>{ui.confirm='end';render()});
  on('nope',()=>{ui.confirm=null;render()});
  on('endyes',()=>{ui.confirm=null;S.phase='final';render();window.scrollTo({top:0})});
  on('back',()=>{ui.confirm=null;S.phase='game';if(!S.current)draw();render()});
  on('rsOpen',()=>{ui.confirm='reset';render();window.scrollTo({top:0,behavior:'smooth'})});
  on('rsNo',()=>{ui.confirm=null;render()});
  on('rsKeep',()=>{ui.confirm=null;ui.err='';ui.ok='';S.rounds=[];S.current=null;S.players.forEach(p=>{p.base=0;p.active=true});S.phase='setup';render()});
  on('rsAll',()=>{ui.confirm=null;ui.err='';ui.ok='';const m=S.mode,c=S.courts,lg=S.lang;S={...fresh(lg),players:[],sample:false,mode:m,courts:c};render()});
}
document.getElementById('resetBtn').onclick=()=>{ui.confirm=ui.confirm==='reset'?null:'reset';render();window.scrollTo({top:0,behavior:'smooth'})};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{
  const lg=b.dataset.lang;if(lg===S.lang)return;
  if(S.sample&&S.phase==='setup')S.players=SAMPLE[lg].map(n=>({id:uid(),name:n,active:true,base:0}));
  S.lang=lg;ui.err='';ui.ok='';render();
});
render();
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
